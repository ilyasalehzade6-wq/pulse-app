<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود — پالس مدیریت</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        
        /* Custom error message display */
        .error-message { display: none; }
        .error-message.show { display: block; }
        
        /* Loading Spinner */
        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Shake animation for errors */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .auth-card.shake { animation: shake 0.4s; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 flex items-center justify-center min-h-screen relative overflow-hidden">

    <!-- Subtle Amber Radial Gradient -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-[600px] h-[600px] bg-amber-500/5 rounded-full blur-[100px]"></div>
    </div>

    <!-- Login Card -->
    <div class="w-full max-w-md bg-[#121215] border border-zinc-800 rounded-2xl p-8 shadow-2xl shadow-black/50 relative z-10 auth-card">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-zinc-800 rounded-xl flex items-center justify-center mb-5 mx-auto border border-zinc-700">
                <i data-lucide="activity" class="w-6 h-6 text-amber-500 stroke-[1.5]"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight mb-2">ورود به پالس مدیریت</h1>
            <p class="text-sm text-zinc-400">برای ادامه، وارد حساب خود شوید.</p>
        </div>

        <!-- Form -->
        <form id="loginForm" class="flex flex-col gap-5">
            
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-2">نام کاربری یا شماره موبایل</label>
                <input type="text" id="identifier" class="w-full bg-[#09090b] border border-zinc-800 rounded-lg px-4 py-2.5 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/50 transition-all" placeholder="نام کاربری یا 09123456789" required autofocus>
            </div>

            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-2">رمز عبور</label>
                <input type="password" id="password" class="w-full bg-[#09090b] border border-zinc-800 rounded-lg px-4 py-2.5 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/50 transition-all" placeholder="••••••••" required minlength="6">
            </div>

            <div id="errorMsg" class="error-message bg-red-500/10 border border-red-500/20 text-red-500 text-sm rounded-lg p-3 text-center transition-all"></div>

            <!-- Primary Button -->
            <button type="submit" id="loginBtn" class="w-full mt-2 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-semibold rounded-lg py-2.5 flex items-center justify-center gap-2 transition-all shadow-lg shadow-amber-500/20">
                <i data-lucide="log-in" class="w-4 h-4 stroke-[2]"></i>
                <span class="btn-text">ورود به حساب</span>
                <span class="spinner"></span>
            </button>
        </form>

        <!-- Divider -->
        <div class="border-t border-zinc-800 my-6"></div>

        <!-- Footer -->
        <div class="text-center text-sm text-zinc-400">
            حساب کاربری ندارید؟
            <a href="signup.html" class="text-amber-500 hover:bg-amber-500/10 px-3 py-1.5 rounded-lg font-medium transition-colors flex items-center justify-center gap-1.5 mx-auto mt-3 w-fit">
                <i data-lucide="user-plus" class="w-4 h-4 stroke-[1.5]"></i>
                ثبت‌نام کنید
            </a>
        </div>
    </div>

    <!-- Version -->
    <div class="absolute bottom-6 text-center w-full">
        <span class="text-xs text-zinc-600">پالس مدیریت — نسخه <span id="version">1.0.0</span></span>
    </div>

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-zinc-800 text-white px-4 py-2 rounded-lg shadow-lg transition-transform translate-y-20 opacity-0"></div>

    <script src="js/license-utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js?v=1793789136631"></script>
    <script src="js/auth.js?v=1793888930196"></script>
    <script>
        lucide.createIcons();
        document.getElementById('version').textContent = APP_VERSION;
    </script>
</body>
</html>
