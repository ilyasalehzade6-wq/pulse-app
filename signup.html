<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0A0A0F">
    <title>ثبت‌نام — پالس اپ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card signup-card">
        
        <div class="auth-header">
            <div class="brand-logo">💎</div>
            <h1 class="brand-name">پالس مدیریت</h1>
            <p class="brand-subtitle">ساخت حساب کاربری جدید</p>
        </div>

        <form id="signupForm" class="auth-form">
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">
                        <span class="label-icon">👤</span>
                        نام
                    </label>
                    <input type="text" id="firstName" class="form-input" 
                           placeholder="علی" required minlength="2">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <span class="label-icon">👤</span>
                        نام خانوادگی
                    </label>
                    <input type="text" id="lastName" class="form-input" 
                           placeholder="محمدی" required minlength="2">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon">📱</span>
                    شماره موبایل
                </label>
                <input type="tel" id="phone" class="form-input phone-input" 
                       placeholder="09123456789" maxlength="11" 
                       inputmode="numeric" required>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon">🔑</span>
                    نام کاربری (برای ورود)
                </label>
                <input type="text" id="username" class="form-input"
                       placeholder="مثلاً: ali_ahmadi"
                       pattern="[a-zA-Z][a-zA-Z0-9_.]{2,29}"
                       title="حداقل ۳ کاراکتر، شروع با حرف انگلیسی"
                       required autocomplete="username">
                <div style="font-size: 11px; color: #95a5a6; margin-top: 6px;">
                    فقط حروف انگلیسی، عدد، _ و . — با حرف شروع شود
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon">🔒</span>
                    رمز عبور
                </label>
                <input type="password" id="password" class="form-input" 
                       placeholder="حداقل ۶ کاراکتر" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon">🏢</span>
                    نام باشگاه / آموزشگاه
                </label>
                <input type="text" id="clubName" class="form-input" 
                       placeholder="مثلاً: باشگاه قهرمانان" required>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="label-icon">📚</span>
                    نوع مجموعه
                </label>
                <select id="clubType" class="form-input" required>
                    <option value="">انتخاب کنید...</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-large" id="signupBtn">
                <span class="btn-text">🚀 ساخت حساب کاربری</span>
                <span class="spinner" style="display: none;"></span>
            </button>

            <div class="error-message" id="errorMsg"></div>
        </form>

        <div class="auth-footer">
            <p class="hint-text">حساب کاربری دارید؟</p>
            <a href="login.html" class="help-link">🔑 ورود به حساب</a>
        </div>
    </div>

    <div class="version-footer">
        <span>پالس مدیریت — نسخه <span id="version"></span></span>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/license-utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
    document.getElementById('version').textContent = APP_VERSION;
</script>

</body>
</html>
